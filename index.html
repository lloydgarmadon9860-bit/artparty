<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ArtParty 🎨 – kresli s kámoši</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
<style>
:root{--bg:#fff7ec;--ink:#2b2140;--pri:#ff5e7e;--pri2:#7b5cff;--card:#ffffff;--muted:#8a809c;--line:#eadff5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer;border:none}
input{font:inherit}
.hidden{display:none!important}
/* ---------- LOBBY ---------- */
#lobby{position:fixed;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px;
 background:radial-gradient(circle at 15% 20%,#ffd6e0 0,transparent 35%),radial-gradient(circle at 85% 15%,#d9ccff 0,transparent 35%),radial-gradient(circle at 70% 90%,#c9f3e3 0,transparent 40%),var(--bg)}
.lobby-card{background:var(--card);border-radius:28px;box-shadow:0 20px 60px rgba(80,40,120,.15);padding:28px;max-width:520px;width:100%}
.logo{font-size:42px;font-weight:900;letter-spacing:-1px;margin:0 0 4px;background:linear-gradient(90deg,#ff5e7e,#ffb347,#7b5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 0 20px;font-weight:600}
label.lbl{display:block;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 0 6px}
.txt{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);font-size:17px;font-weight:700;outline:none}
.txt:focus{border-color:var(--pri2)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:13px 18px;border-radius:16px;font-weight:800;font-size:16px;background:var(--pri);color:#fff;box-shadow:0 6px 0 #d63d5e;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d63d5e}
.btn.alt{background:var(--pri2);box-shadow:0 6px 0 #5a3fd6}
.btn.ghost{background:#f1ebfa;color:var(--ink);box-shadow:0 6px 0 #d8cdea}
.btn.small{padding:8px 12px;font-size:14px;border-radius:12px;box-shadow:0 4px 0 #d8cdea}
.cursor-preview{display:flex;align-items:center;justify-content:center;height:110px;border-radius:20px;background:repeating-conic-gradient(#faf6ff 0 25%,#fff 0 50%) 0 0/24px 24px;border:2px dashed var(--line);position:relative;overflow:hidden;margin-top:10px}
.err{color:#d63d5e;font-weight:700;margin-top:10px}
/* ---------- CURSOR EDITOR ---------- */
.picker{display:flex;flex-wrap:wrap;gap:6px}
.pick{min-width:42px;height:42px;border-radius:12px;background:#f6f1fd;font-size:22px;display:flex;align-items:center;justify-content:center;padding:0 8px;border:2px solid transparent;font-weight:700}
.pick.txtpick{font-size:14px}
.pick.on{border-color:var(--pri2);background:#ece5ff}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.swatch.on{box-shadow:0 0 0 3px var(--pri2)}
/* ---------- APP ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:2px solid var(--line);flex-wrap:wrap;z-index:5}
#topbar .logo{font-size:24px;margin:0}
.code-chip{background:#f1ebfa;border-radius:12px;padding:6px 10px;font-weight:900;letter-spacing:2px}
#people{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.person{display:flex;align-items:center;gap:4px;background:#f6f1fd;border-radius:20px;padding:3px 10px 3px 4px;font-weight:800;font-size:13px}
.person .em{font-size:18px}
#main{flex:1;display:flex;min-height:0}
#tools{width:84px;background:#fff;border-right:2px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;overflow-y:auto}
.tool{width:60px;min-height:52px;border-radius:14px;background:#f6f1fd;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid transparent}
.tool small{font-size:10px;font-weight:800;color:var(--muted)}
.tool.on{border-color:var(--pri2);background:#ece5ff}
.sep{width:50px;height:2px;background:var(--line);margin:4px 0}
.colors{display:grid;grid-template-columns:repeat(2,26px);gap:6px}
.col{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.col.on{box-shadow:0 0 0 3px var(--ink)}
#sizeRange{writing-mode:vertical-lr;direction:rtl;height:90px;width:24px}
#stageWrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-width:0;padding:10px}
#board{position:relative;background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(80,40,120,.15);touch-action:none;overflow:hidden;cursor:none}
#board canvas{position:absolute;inset:0;width:100%;height:100%}
#cursors{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cur{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;z-index:3}
.cur .ic{display:inline-block;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));transform-origin:center}
.cur .tag{position:absolute;left:70%;top:85%;white-space:nowrap;color:#fff;font-weight:800;font-size:12px;padding:2px 8px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.cur.me .tag{opacity:.85}
.anim-bounce{animation:bounce .6s infinite alternate ease-in-out}
.anim-spin{animation:spin 1.6s infinite linear}
.anim-pulse{animation:pulse .8s infinite alternate ease-in-out}
.anim-wobble{animation:wobble .5s infinite alternate ease-in-out}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{from{transform:scale(.85)}to{transform:scale(1.2)}}
@keyframes wobble{from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}
.particle{position:absolute;pointer-events:none;font-size:14px;z-index:2;animation:fadeUp .9s forwards ease-out}
@keyframes fadeUp{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.react{position:absolute;pointer-events:none;font-size:40px;z-index:4;animation:floatUp 2.2s forwards ease-out}
@keyframes floatUp{0%{transform:translate(-50%,-50%) scale(.3)}15%{transform:translate(-50%,-60%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
#side{width:250px;background:#fff;border-left:2px solid var(--line);padding:10px;overflow-y:auto}
#side h3{margin:10px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tpl{background:#f6f1fd;border-radius:12px;padding:6px 2px;font-size:24px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center}
.tpl small{font-size:10px;font-weight:800;color:var(--muted)}
.tpl.on{border-color:var(--pri);background:#ffe6ec}
.modes{display:flex;flex-direction:column;gap:6px}
.mode{text-align:left;background:#f6f1fd;border-radius:12px;padding:8px 10px;font-weight:800;border:2px solid transparent}
.mode small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.mode.on{border-color:var(--pri2);background:#ece5ff}
.reacts{display:flex;flex-wrap:wrap;gap:4px}
.reacts button{font-size:24px;background:#f6f1fd;border-radius:12px;width:44px;height:44px}
#stepBox{background:#f6f1fd;border-radius:14px;padding:10px;margin-top:10px}
#stepTitle{font-weight:900;font-size:15px;display:flex;align-items:center;gap:8px}
#stepTitle .dot{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--line);flex:none}
#stepBar{height:10px;background:#fff;border-radius:6px;margin-top:6px;overflow:hidden}
#stepFill{height:100%;width:0;background:linear-gradient(90deg,#ff5e7e,#7b5cff);transition:width .3s}
#stepChip{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.9);border-radius:12px;padding:4px 10px;font-weight:900;z-index:6;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn:disabled{opacity:.4}
#challengeBox{font-weight:900;font-size:22px;text-align:center;padding:6px;border-radius:12px;background:#fff3c4;margin-top:6px}
#strictWarn{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#ff5e7e;color:#fff;font-weight:800;padding:6px 14px;border-radius:20px;z-index:6;opacity:0;transition:opacity .2s;pointer-events:none}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;font-weight:700;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
#modal{position:fixed;inset:0;background:rgba(43,33,64,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
#modalCard{background:#fff;border-radius:24px;padding:24px;max-width:440px;width:100%;max-height:90vh;overflow:auto;text-align:center}
.stars{font-size:48px;letter-spacing:6px}
.big{font-size:56px;font-weight:900;margin:4px 0;color:var(--pri2)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:45}
#offline{background:#fff3c4;font-weight:700;padding:6px 12px;text-align:center;font-size:13px}
@media (max-width:820px){
 #main{flex-direction:column}
 #tools{width:100%;flex-direction:row;border-right:none;border-bottom:2px solid var(--line);overflow-x:auto;overflow-y:hidden;padding:6px}
 .tool{min-width:52px;width:52px;min-height:48px}
 .sep{width:2px;height:40px;margin:0 2px}
 .colors{grid-template-columns:repeat(8,24px);grid-template-rows:auto}
 .col{width:24px;height:24px}
 #sizeRange{writing-mode:horizontal-tb;direction:ltr;width:90px;height:24px}
 #side{width:100%;border-left:none;border-top:2px solid var(--line);max-height:34vh}
 #topbar .logo{font-size:20px}
}
</style>
</head>
<body>

<!-- ================= LOBBY ================= -->
<div id="lobby">
 <div class="lobby-card">
  <h1 class="logo">ArtParty 🎨</h1>
  <p class="sub">Kresli s kámoši naživo – volně, podle šablony, nebo jen po čarách. 🖌️</p>

  <label class="lbl">Tvoje jméno</label>
  <input id="nameIn" class="txt" maxlength="16" placeholder="Např. Wolfe">

  <label class="lbl">Tvůj kurzor ✨</label>
  <div class="cursor-preview" id="lobbyPreview"></div>
  <div style="margin-top:10px"><button class="btn ghost small" id="openCursorEd">🎛️ Upravit kurzor</button></div>

  <label class="lbl">Místnost</label>
  <div class="row">
   <button class="btn" id="createBtn" style="flex:1">➕ Nová místnost</button>
  </div>
  <div class="row" style="margin-top:12px">
   <input id="codeIn" class="txt" maxlength="5" placeholder="KÓD" style="flex:1;text-transform:uppercase;letter-spacing:3px">
   <button class="btn alt" id="joinBtn">Připojit 🚪</button>
  </div>
  <div class="err" id="lobbyErr"></div>
 </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
 <div id="offline" class="hidden">⚠️ Nejsi připojený k serveru – kreslíš jen sám. Zkus obnovit stránku.</div>
 <div id="topbar">
  <span class="logo">ArtParty 🎨</span>
  <span class="code-chip" id="codeChip">----</span>
  <button class="btn ghost small" id="shareBtn">🔗 Pozvat</button>
  <button class="btn ghost small" id="cursorBtn">🎛️ Kurzor</button>
  <button class="btn ghost small" id="leaveBtn">🚪</button>
  <div id="people"></div>
 </div>
 <div id="main">
  <div id="tools">
   <button class="tool on" data-brush="pen">✏️<small>Pero</small></button>
   <button class="tool" data-brush="marker">🖍️<small>Fixa</small></button>
   <button class="tool" data-brush="neon">💡<small>Neon</small></button>
   <button class="tool" data-brush="rainbow">🌈<small>Duha</small></button>
   <button class="tool" data-brush="spray">💨<small>Sprej</small></button>
   <button class="tool" data-brush="eraser">🧽<small>Guma</small></button>
   <div class="sep"></div>
   <div class="colors" id="colors"></div>
   <input type="color" id="colorIn" value="#2b2140" style="width:52px;height:30px;border:none;background:none">
   <div class="sep"></div>
   <input type="range" id="sizeRange" min="2" max="40" value="8">
   <div class="sep"></div>
   <button class="tool" id="undoBtn">↩️<small>Zpět</small></button>
   <button class="tool" id="clearBtn">🗑️<small>Smazat</small></button>
   <button class="tool" id="saveBtn">💾<small>Uložit</small></button>
  </div>
  <div id="stageWrap">
   <div id="board">
    <canvas id="tplCv"></canvas>
    <canvas id="drawCv"></canvas>
    <canvas id="liveCv"></canvas>
    <div id="cursors"></div>
    <div id="strictWarn">Jen po čarách šablony! ✋</div>
    <div id="stepChip">1/8</div>
   </div>
  </div>
  <div id="side">
   <h3>Režim</h3>
   <div class="modes" id="modes">
    <button class="mode" data-mode="guide">🧭 Volně podle šablony<small>Krok po kroku, ale můžeš i mimo</small></button>
    <button class="mode" data-mode="strict">🎯 Jen podle šablony<small>Barva zůstane jen v ploše kroku</small></button>
    <button class="mode" data-mode="free">🌀 Volně jakkoliv<small>Prázdné plátno, kresli co chceš</small></button>
   </div>
   <div id="stepBox">
    <div id="stepTitle">Krok 1/8</div>
    <div id="stepBar"><div id="stepFill"></div></div>
    <div class="row" style="gap:6px;margin-top:6px"><button class="btn ghost small" id="prevStep" style="flex:1">◀ Zpět</button><button class="btn ghost small" id="nextStep" style="flex:1">Další ▶</button></div>
   </div>
   <h3>Šablona</h3>
   <div class="tpl-grid" id="tplGrid"></div>
   <button class="btn alt small" id="scoreBtn" style="width:100%;margin-top:10px">⭐ Ohodnotit kresbu</button>
   <h3>Výzva</h3>
   <button class="btn small" id="challengeBtn" style="width:100%;box-shadow:0 4px 0 #d63d5e">⏱️ Kreslíme na čas (90 s)</button>
   <div id="challengeBox" class="hidden"></div>
   <h3>Reakce</h3>
   <div class="reacts" id="reacts"></div>
  </div>
 </div>
</div>

<!-- ================= MODAL ================= -->
<div id="modal" class="hidden"><div id="modalCard"></div></div>
<canvas id="confetti"></canvas>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getDatabase, ref, set, push, remove, update, onValue, onChildAdded, onChildRemoved, onDisconnect, get, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

/* ======================= FIREBASE ======================= */
const firebaseConfig = {
  apiKey: "AIzaSyBovG00qfDWUBcS9pJlS_FwOH4etF9Sv0Y",
  authDomain: "flex-bubble.firebaseapp.com",
  databaseURL: "https://flex-bubble-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "flex-bubble",
  storageBucket: "flex-bubble.firebasestorage.app",
  messagingSenderId: "171220277752",
  appId: "1:171220277752:web:d5d68647bf1759db58de0d"
};
const ROOT = 'artparty/rooms';
let db = null, auth = null, uid = null, online = false, serverOffset = 0;
const authReady = new Promise((resolve) => {
  try {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app); db = getDatabase(app);
    onAuthStateChanged(auth, (u) => { if (u) { uid = u.uid; online = true; resolve(true); } });
    signInAnonymously(auth).catch((e) => { console.warn('auth', e); resolve(false); });
    setTimeout(() => resolve(online), 8000);
  } catch (e) { console.warn(e); resolve(false); }
});

/* ======================= HELPERS ======================= */
const $ = (s) => document.querySelector(s);
const N = 10000; // normalizované souřadnice 0..N
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toast._t); toast._t = setTimeout(() => el.style.opacity = 0, 2200); }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const now = () => Date.now() + serverOffset;
function randCode() { const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let s = ''; for (let i = 0; i < 4; i++) s += L[Math.floor(Math.random() * L.length)]; return s; }

/* ======================= ŠABLONY / LEKCE (1000 x 750) ======================= */
// každá šablona = kroky; krok = { n: název, c: barva, t: 'fill' (vybarvit plochu) | 'line' (obtáhnout čáru), w: šířka čáry, d: SVG path }
function rell(cx, cy, rx, ry, deg = 0) {
  const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  const x1 = cx - rx * c, y1 = cy - rx * s, x2 = cx + rx * c, y2 = cy + rx * s;
  return `M${x1.toFixed(1)},${y1.toFixed(1)} A${rx},${ry} ${deg} 1,0 ${x2.toFixed(1)},${y2.toFixed(1)} A${rx},${ry} ${deg} 1,0 ${x1.toFixed(1)},${y1.toFixed(1)} Z `;
}
const circ = (cx, cy, r) => rell(cx, cy, r, r);
const ell = (cx, cy, rx, ry) => rell(cx, cy, rx, ry);
const mirror = (d) => d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g, (m, x, y) => `${(1000 - parseFloat(x)).toFixed(1)},${y}`);
function bez(P, t) { const u = 1 - t; return { x: u*u*u*P[0][0] + 3*u*u*t*P[1][0] + 3*u*t*t*P[2][0] + t*t*t*P[3][0], y: u*u*u*P[0][1] + 3*u*u*t*P[1][1] + 3*u*t*t*P[2][1] + t*t*t*P[3][1] }; }
function bezN(P, t) { const a = bez(P, Math.max(0, t - .01)), b = bez(P, Math.min(1, t + .01)); const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1; return { x: -dy / L, y: dx / L }; }
function stripes(curves, ts, len) { let d = ''; for (const [P, t] of ts.map(([i, t]) => [curves[i], t])) { const p = bez(P, t), n = bezN(P, t); d += `M${(p.x - n.x * len).toFixed(1)},${(p.y - n.y * len).toFixed(1)} Q${(p.x + n.x * 4).toFixed(1)},${(p.y + n.y * 4 + 10).toFixed(1)} ${(p.x + n.x * len).toFixed(1)},${(p.y + n.y * len).toFixed(1)} `; } return d; }
function starPath() { let s = ''; for (let i = 0; i < 10; i++) { const r = i % 2 ? 125 : 300, a = -Math.PI / 2 + i * Math.PI / 5; s += (i ? 'L' : 'M') + (500 + r * Math.cos(a)).toFixed(0) + ',' + (395 + r * Math.sin(a)).toFixed(0) + ' '; } return s + 'Z'; }
function sunRays() { let s = ''; for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; s += `M${(500 + 180 * Math.cos(a)).toFixed(0)},${(375 + 180 * Math.sin(a)).toFixed(0)} L${(500 + 270 * Math.cos(a)).toFixed(0)},${(375 + 270 * Math.sin(a)).toFixed(0)} `; } return s; }

// --- Balónková zvířátka (pejsek + zajíček) ---
const DOG = rell(330,250,72,48,-15) + rell(430,228,58,22,-8) + circ(497,220,13) + rell(268,185,28,62,-30) + rell(300,330,34,62,12)
  + rell(335,440,125,50,-5) + rell(225,535,30,88,14) + rell(290,545,30,88,-4) + rell(400,540,30,88,6) + rell(465,525,30,88,-18) + rell(470,380,22,55,30);
const BUN = circ(690,250,62) + rell(648,120,28,86,-15) + rell(733,115,28,86,15) + rell(622,265,36,22) + circ(580,263,12)
  + rell(720,470,112,142) + rell(648,622,62,30) + rell(795,622,72,32);
const L_BALLOONS = { n: 'Balónky', e: '🎈', steps: [

function leaveRoom() {
  if (online && room) { remove(ref(db, `${ROOT}/${room}/cursors/${uid}`)); remove(ref(db, `${ROOT}/${room}/live/${uid}`)); }
  location.hash = ''; location.reload();
}

/* ======================= UI ======================= */
$('#nameIn').value = me.name || '';
$('#nameIn').oninput = (e) => { me.name = e.target.value.trim().slice(0, 16); saveMe(); renderLobbyPreview(); };
$('#openCursorEd').onclick = openCursorEditor; $('#cursorBtn').onclick = openCursorEditor;
$('#createBtn').onclick = () => enterRoom(randCode(), true);
$('#joinBtn').onclick = () => enterRoom($('#codeIn').value, false);
$('#codeIn').onkeydown = (e) => { if (e.key === 'Enter') $('#joinBtn').click(); };
$('#leaveBtn').onclick = () => confirmBox('Odejít z místnosti? 🚪', leaveRoom);
$('#shareBtn').onclick = async () => {
  const url = location.origin + location.pathname + '#' + room;
  try { if (navigator.share) { await navigator.share({ title: 'ArtParty 🎨', text: `Pojď se mnou kreslit! Kód: ${room}`, url }); return; } } catch (e) { }
  try { await navigator.clipboard.writeText(url); toast('Odkaz zkopírován! 📋'); } catch (e) { toast(url); }
};
renderLobbyPreview();
const hashCode = location.hash.replace('#', '').trim();
if (hashCode) { $('#codeIn').value = hashCode.toUpperCase(); $('#lobbyErr').style.color = '#7b5cff'; $('#lobbyErr').textContent = `Pozvánka do místnosti ${hashCode.toUpperCase()} – napiš jméno a klikni Připojit 🎉`; }

/* ======================= KONFETY ======================= */
function confetti() {
  const c = $('#confetti'), x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const P = Array.from({ length: 160 }, () => ({ x: innerWidth / 2, y: innerHeight / 2, vx: (Math.random() - .5) * 18, vy: Math.random() * -18 - 4, s: Math.random() * 8 + 4, h: Math.random() * 360, r: Math.random() * 6 }));
  let f = 0; (function tick() { x.clearRect(0, 0, c.width, c.height); for (const p of P) { p.vy += .5; p.x += p.vx; p.y += p.vy; p.r += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = `hsl(${p.h},90%,60%)`; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); } if (++f < 120) requestAnimationFrame(tick); else x.clearRect(0, 0, c.width, c.height); })();
}
</script>
